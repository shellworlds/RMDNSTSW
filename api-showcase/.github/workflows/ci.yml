name: CI

on:
  push:
    branches: [ FullStackAPI ]
  pull_request:
    branches: [ FullStackAPI ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Build API Gateway
      run: |
        cd api-showcase/api-gateway
        mvn clean package -DskipTests
    
    - name: Build User Service
      run: |
        cd api-showcase/user-service
        mvn clean package -DskipTests
    
    - name: Build BFF Web
      run: |
        cd api-showcase/bff-web
        mvn clean package -DskipTests
