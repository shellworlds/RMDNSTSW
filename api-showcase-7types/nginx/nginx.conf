events {
    worker_connections 1024;
}

http {
    upstream rest_backend {
        server rest-api:8081;
    }
    
    upstream graphql_backend {
        server graphql-api:8082;
    }
    
    upstream websocket_backend {
        server websocket-api:8083;
    }

    server {
        listen 80;
        
        # REST API routing
        location /rest/ {
            proxy_pass http://rest_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # GraphQL API routing
        location /graphql {
            proxy_pass http://graphql_backend/graphql;
            proxy_set_header Host $host;
        }
        
        # WebSocket routing
        location /ws {
            proxy_pass http://websocket_backend/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
        
        # API documentation
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}
