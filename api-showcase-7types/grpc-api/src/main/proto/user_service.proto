syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.apishowcase.grpc";
option java_outer_classname = "UserServiceProto";

package grpcapi;

// User service definition
service UserService {
  rpc GetUser (UserRequest) returns (UserResponse) {}
  rpc ListUsers (UserListRequest) returns (stream UserResponse) {}
  rpc CreateUser (CreateUserRequest) returns (UserResponse) {}
  rpc UpdateUser (UpdateUserRequest) returns (UserResponse) {}
  rpc DeleteUser (UserRequest) returns (DeleteResponse) {}
  rpc StreamUsers (stream UserStreamRequest) returns (stream UserResponse) {}
}

// Messages
message UserRequest {
  string user_id = 1;
}

message UserListRequest {
  int32 page = 1;
  int32 size = 2;
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
}

message UpdateUserRequest {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
}

message UserStreamRequest {
  string action = 1;
  string user_id = 2;
}

message UserResponse {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  string created_at = 6;
  string updated_at = 7;
}

message DeleteResponse {
  bool success = 1;
  string message = 2;
}

// Product service for e-commerce example
service ProductService {
  rpc GetProduct (ProductRequest) returns (ProductResponse) {}
  rpc ListProducts (ProductListRequest) returns (stream ProductResponse) {}
  rpc SearchProducts (SearchRequest) returns (stream ProductResponse) {}
  rpc UpdateInventory (InventoryUpdate) returns (InventoryResponse) {}
}

message ProductRequest {
  string product_id = 1;
}

message ProductListRequest {
  string category = 1;
  int32 page = 2;
  int32 size = 3;
}

message SearchRequest {
  string query = 1;
  repeated string filters = 2;
}

message InventoryUpdate {
  string product_id = 1;
  int32 quantity = 2;
  string operation = 3; // ADD, REMOVE, SET
}

message ProductResponse {
  string product_id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock = 5;
  repeated string categories = 6;
}

message InventoryResponse {
  bool success = 1;
  int32 new_quantity = 2;
  string message = 3;
}
