version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: apis
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Redis for caching and pub/sub
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # REST API Service
  rest-api:
    build: ./rest-api
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis

  # GraphQL Service
  graphql-api:
    build: ./graphql-api
    ports:
      - "8082:8082"
    depends_on:
      - postgres

  # gRPC Service
  grpc-api:
    build: ./grpc-api
    ports:
      - "50051:50051"

  # WebSocket Service
  websocket-api:
    build: ./websocket-api
    ports:
      - "8083:8083"

  # API Gateway (Nginx) to route all APIs
  api-gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - rest-api
      - graphql-api
      - grpc-api
      - websocket-api

volumes:
  postgres-data:
