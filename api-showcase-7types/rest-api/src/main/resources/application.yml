server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: rest-api
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/apis
    username: admin
    password: admin123
  
  jpa:
    hibernate:
      ddl-auto: update
  
  cache:
    type: redis
    redis:
      time-to-live: 60000
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

logging:
  level:
    com.apishowcase.rest: DEBUG
